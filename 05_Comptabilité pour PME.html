<title>GSC Compta – Gestion comptable et financière</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#e3e7ee;--pri:#29235C;--pri2:#ecebf6;--acc:#E6007E;--bad:#b42318;--badbg:#fdeceb;--ok:#067647;--okbg:#e7f6ee;--warn:#92580a;--warnbg:#fef3dc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161c;--card:#1a2029;--ink:#e8ecf2;--mut:#98a2b3;--line:#2b3441;--pri:#a9a3ec;--pri2:#26224d;--acc:#ff5cae;--bad:#ff8a80;--badbg:#3a1d1b;--ok:#5fd39a;--okbg:#14301f;--warn:#f2c36b;--warnbg:#38290f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#29235C;color:#fff;border-bottom:4px solid #E6007E;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header .sub{opacity:.85;font-size:12px}header select{max-width:280px}
.wrap{display:flex;min-height:calc(100vh - 56px)}
nav{width:218px;background:var(--card);border-right:1px solid var(--line);padding:8px;flex:none}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover{background:var(--pri2)}nav button.on{background:var(--pri);color:#fff}nav .g{font-size:11px;text-transform:uppercase;color:var(--mut);margin:10px 8px 2px}
@media (prefers-color-scheme:dark){nav button.on{color:#1a1640}}
main{flex:1;padding:16px;min-width:0;max-width:1200px}
h2{margin:0 0 4px;font-size:20px}h3{margin:16px 0 6px;font-size:16px}h4{margin:10px 0 4px}
.muted{color:var(--mut);font-size:13px}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}textarea{min-height:70px}
.f{display:grid;gap:8px 12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.f .w{grid-column:1/-1}
button.b,a.b{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;text-decoration:none}
@media (prefers-color-scheme:dark){button.b,a.b{color:#1a1640}}
button.g2{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.sm{padding:3px 8px;font-size:13px}button.dg{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--pri2);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tr.t td{font-weight:700;background:var(--pri2)}tr.s td{font-weight:600}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri)}.ref{display:inline-block;font-size:11px;color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:4px}
.al{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13px}.al.ok{background:var(--okbg);color:var(--ok)}.al.bad{background:var(--badbg);color:var(--bad)}.al.warn{background:var(--warnbg);color:var(--warn)}.al.info{background:var(--pri2);color:var(--ink)}
.task{display:flex;gap:10px;padding:8px;border-bottom:1px solid var(--line)}.task input[type=checkbox]{width:auto;margin-top:4px}.task.d .tt{text-decoration:line-through;opacity:.6}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on{color:#1a1640}}
.doc{background:#fff;color:#111;padding:24px;border:1px solid var(--line);border-radius:6px;font-family:Georgia,serif;line-height:1.5}.doc h1,.doc h2,.doc h3{font-family:Georgia,serif;color:#111}.doc table{background:#fff;color:#111}.doc th{background:#eee;position:static}.doc td,.doc th{border:1px solid #bbb}
@media (max-width:760px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow:auto;gap:2px;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}nav .g{display:none}}
@media print{header,nav,.noprint{display:none!important}main{padding:0;max-width:none}body{background:#fff}.box{border:0}}
header .logo{height:44px;width:auto;display:block}header .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25)}
nav button.on{box-shadow:inset 4px 0 0 #E6007E}.kpi{border-top:3px solid #E6007E}th{border-bottom:2px solid #E6007E}
.plogo{display:none}@media print{.plogo{display:block;margin:0 0 10px;padding-bottom:8px;border-bottom:3px solid #E6007E}.plogo img{height:46px}}

 ['g','Pilotage'],['home','Tableau de bord'],['clients','Portefeuille clients'],

];

function getp(o,p){return p.split('.').reduce(function(a,k){return a==null?'':a[k]},o)}
function setp(o,p,v){var ks=p.split('.');for(var i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function fld(lab,path,o){o=o||{};var c=C(),v=getp(c,path),t=o.type||'text',h='<div'+(o.w?' class="w"':'')+'><label>'+esc(lab)+'</label>';
 if(t==='select')h+='<select data-k="'+path+'">'+o.opts.map(function(x){var val=Array.isArray(x)?x[0]:x,lb=Array.isArray(x)?x[1]:x;return '<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(lb)+'</option>'}).join('')+'</select>';
 else if(t==='textarea')h+='<textarea data-k="'+path+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(v)+'</textarea>';
 else h+='<input type="'+(t==='number'?'text':t)+'" '+(t==='number'?'inputmode="decimal" data-num="1" ':'')+'data-k="'+path+'" value="'+esc(v)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>';
 return h+'</div>'}
function needClient(){if(C())return false;$('#main').innerHTML='<h2>Aucun dossier sélectionné</h2><div class="al warn">Choisissez ou créez un client dans « Portefeuille clients ».</div><button class="b" data-act="go:clients">Ouvrir le portefeuille</button>';return true}
function alertBox(k,t){return '<div class="al '+k+'">'+t+'</div>'}
function tbl(head,rows,cls){return '<div class="tw"><table'+(cls?' class="'+cls+'"':'')+'><thead><tr>'+head.map(function(h){var a=Array.isArray(h);return '<th'+(a&&h[1]?' class="n"':'')+'>'+esc(a?h[0]:h)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function applies(t,c){var f=FORMES[c.forme];if(t.f&&t.f.indexOf(c.forme)<0)return false;if(t.t2){var ok=false;t.t2.forEach(function(x){if(x==='soc'&&f.soc)ok=true;if(x==='ei'&&(c.forme==='ei'||c.forme==='ent'))ok=true});if(!ok)return false}return true}
function progress(c){var l=tasksOf(c).filter(function(t){return applies(t,c)});var d=l.filter(function(t){return c.tasks[t.id]&&c.tasks[t.id].done}).length;return {n:l.length,d:d,p:l.length?Math.round(100*d/l.length):0}}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function addMonths(s,n){var d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function daysTo(s){return Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}

function refreshSel(){
 $('#selC').innerHTML='<option value="">— Dossier client —</option>'+S.clients.map(function(c){return '<option value="'+c.id+'"'+(c.id===S.cur?' selected':'')+'>'+esc(c.nom)+'</option>'}).join('');
 var c=C();$('#selE').innerHTML=c?c.exos.map(function(x){return '<option value="'+x.id+'"'+(x.id===c.curExo?' selected':'')+'>'+esc(x.label)+(x.closed?' (clos)':'')+'</option>'}).join(''):'';
}

function go(t){if(t==='bp')t='mpe';TAB=t;S.ui.tab=t;saveS();renderNav();refreshSel();var f=VIEWS[t];$('#main').innerHTML='';f();window.scrollTo(0,0)}

function vHome(){
 var h='<h2>Tableau de bord</h2><div class="muted">Vue d\'ensemble du portefeuille de '+esc(S.cfg.gsc)+'.</div>';

 h+='<div class="grid" style="margin:10px 0"><div class="kpi"><b>'+n+'</b><span>Dossiers clients</span></div><div class="kpi"><b>'+cr+'</b><span>En phase de création</span></div><div class="kpi"><b>'+ex+'</b><span>En tenue de comptabilité</span></div><div class="kpi"><b>'+S.clients.reduce(function(a,c){return a+c.entries.length},0)+'</b><span>Écritures saisies</span></div></div>';

 var rows=S.clients.map(function(c){var p=progress(c),e=E(c),al='';

 if(n)h+=tbl(['Client','Exercice','Avancement de la procédure','Échéance'],[rows]);
 h+='<div class="box"><h3>Le parcours d\'un dossier</h3><div class="muted">Les menus suivent la vie du client : <b>Fiche</b> → <b>Procédure et formalités</b> → <b>Projet économique</b> → <b>Saisie des écritures</b> → <b>Clôture</b> → <b>États financiers</b> → <b>Rapports et documents</b>. Chaque étape de la procédure indique sa base légale (Actes uniformes OHADA, SYSCOHADA révisé) ou signale une pratique nationale à vérifier.</div></div>';

function smtHtml(c,e){

var DOCT={
 lettre:{n:'Lettre de mission',f:function(c,e){return '<h1 style="text-align:center">LETTRE DE MISSION</h1><p>'+esc(S.cfg.gsc)+', ci-après « le Cabinet »,<br>et '+L(c.nom)+' ('+esc(FORMES[c.forme].n)+'), représenté(e) par '+L(c.dirigeant)+', ci-après « le Client ».</p><h2>1. Nature de la mission</h2><p>Le Cabinet assiste le Client dans : (cocher) ☐ la création de l\'entreprise et les formalités ; ☐ l\'élaboration du document de projet et du business plan ; ☐ la tenue de la comptabilité selon le SYSCOHADA révisé ; ☐ l\'établissement des états financiers de l\'exercice '+L(e&&e.label)+' ; ☐ les déclarations fiscales et sociales périodiques.</p><h2>2. Cadre et normes</h2><p>La mission est réalisée conformément aux Actes uniformes de l\'OHADA applicables (notamment AUDCIF, AUSCGIE, AUDCG), au SYSCOHADA révisé et à la réglementation nationale en vigueur. Le Cabinet n\'est pas commissaire aux comptes et ne certifie pas les comptes.</p><h2>3. Obligations du Client</h2><p>Le Client fournit dans les délais l\'ensemble des pièces justificatives, relevés bancaires et informations nécessaires, garantit leur exactitude et reste responsable de ses comptes, de ses déclarations et des décisions de gestion.</p><h2>4. Obligations du Cabinet</h2><p>Le Cabinet exécute la mission avec diligence, respecte le secret professionnel et conserve les documents conformément aux délais légaux (dix ans pour les documents comptables).</p><h2>5. Honoraires et durée</h2><p>Honoraires : '+L('', 'montant ou barème')+' FCFA, payables '+L('', 'modalités')+'. Durée : '+L('', 'période')+'. Reconduction et résiliation : préavis de '+L('', 'durée')+'.</p><p>Fait à '+L(c.adresse,'lieu')+', le '+fdate(today())+'</p><table><tr><td>Pour le Cabinet<br><br><br></td><td>Pour le Client<br><br><br></td></tr></table>'}},

 pv:{n:'Procès-verbal d\'assemblée générale d\'approbation des comptes',f:function(c,e){var R=compteResultat(ledger(c,e));return '<h1 style="text-align:center">PROCÈS-VERBAL DE L\'ASSEMBLÉE GÉNÉRALE ORDINAIRE</h1><p style="text-align:center">'+esc(c.nom)+' · '+esc(FORMES[c.forme].n)+' au capital de '+(c.capital?fmt(num(c.capital)):L(''))+' FCFA<br>Siège : '+L(c.adresse)+' · RCCM '+L(c.rccm)+'</p><p>L\'an '+L('', 'année')+', le '+L('', 'date')+', à '+L('', 'heure')+', les associés / actionnaires de la société se sont réunis à '+L('', 'lieu')+', sur convocation de '+L(c.dirigeant)+'.</p><p>Présents ou représentés : '+L('', 'liste et nombre de parts ou actions')+'. Le quorum étant atteint, l\'assemblée est valablement constituée.</p><h2>Ordre du jour</h2><ol><li>Lecture du rapport de gestion et, le cas échéant, du rapport du commissaire aux comptes</li><li>Approbation des états financiers de l\'exercice clos le '+fdate(e.end)+'</li><li>Affectation du résultat</li><li>Quitus aux dirigeants</li><li>Questions diverses</li></ol><h2>Première résolution – Approbation des comptes</h2><p>L\'assemblée approuve les états financiers de l\'exercice clos le '+fdate(e.end)+', faisant apparaître un résultat net de <b>'+fmt(R.XI)+' FCFA</b> pour un chiffre d\'affaires de '+fmt(R.XB)+' FCFA.</p><h2>Deuxième résolution – Affectation du résultat</h2><p>Le résultat est affecté comme suit : réserve légale '+L('', 'montant')+' (au moins un dixième du bénéfice, jusqu\'à ce que la réserve atteigne le cinquième du capital – AUSCGIE art. 346) ; dividendes '+L('', 'montant')+' ; report à nouveau '+L('', 'montant')+'.</p><h2>Troisième résolution – Quitus</h2><p>L\'assemblée donne quitus entier et sans réserve aux dirigeants pour leur gestion de l\'exercice.</p><p>Plus rien n\'étant à l\'ordre du jour, la séance est levée. Le présent procès-verbal est signé par le président de séance.</p><p><br>Le président de séance : _______________</p><p class="muted"><i>Rappel : dépôt des états financiers au R var EXPL={
home:'<p>Cet écran résume votre activité : nombre de dossiers, avancement de chaque procédure et échéances de clôture. Cliquez sur un nom de client pour ouvrir son dossier. Le menu de gauche suit la vie d\'un client : fiche, procédure, projet, comptabilité, clôture, états, rapports.</p>',
clients:'<p>Un <b>dossier</b> correspond à une entreprise cliente. Choisissez la forme juridique à la création : elle détermine les étapes de la procédure et le système comptable proposé. Le choix « Création » ou « Exploitation » indique si l\'entreprise est à créer ou déjà en activité. Le sélecteur en haut de page change de client à tout moment.</p>',
dossier:'<p>La <b>fiche</b> contient l\'identité du client. Le <b>système comptable</b> décide du niveau d\'états financiers : le système normal produit bilan, compte de résultat, tableau des flux et notes ; le système minimal de trésorerie (petites entreprises) produit un état des recettes et des dépenses ; le SYCEBNL s\'applique aux associations et ONG. L\'<b>exercice</b> est la période comptable (en général 12 mois) : toutes les écritures y sont rattachées, et un exercice clos est verrouillé.</p>',
proc:'<p>Chaque ligne est une étape que GSC doit accomplir pour le client, avec sa <b>base légale</b>. Cochez l\'étape quand elle est faite : la date du jour s\'inscrit, et vous pouvez ajouter une note ou un numéro de pièce. Le bouton « Ouvrir l\'outil » vous emmène à l\'écran concerné, « Générer le document » prépare la trame du document. La barre de progression alimente le tableau de bord.</p>',
mpe:'<p>Cette rubrique reprend le <b>modèle de projet économique</b> : remplissez les onglets, les calculs financiers se font seuls et le document Word suit le plan du modèle. Chaque ligne est modifiable ou supprimable.</p><p>Ancienne explication : le <b>document de projet</b> raconte l\'idée (qui, quoi, pour qui, avec quels moyens). Le <b>business plan</b> la chiffre : saisissez les investissements, le financement, le chiffre d\'affaires et les charges ; l\'outil calcule cinq années de résultat et de trésorerie, le plan de financement initial, le seuil de rentabilité et le délai de récupération. L\'onglet 4 assemble le tout en un dossier à remettre au client ou à la banque. L\'onglet 5 contient le <b>modèle de projet économique</b> complet (fiche synoptique, étude de marché, étude technique, étude financière détaillée), qui se génère en Word.</p>',
ecr:'<p>Une <b>écriture comptable</b> enregistre un fait de l\'entreprise (achat, vente, paiement…) en au moins deux lignes : des <b>débits</b> et des <b>crédits</b> de même total. Deux façons de saisir : (1) choisissez une <b>opération guidée</b> : l\'outil propose les comptes, explique pourquoi et vous montre un exemple ; (2) saisissez librement les lignes. Sous le tableau, la zone « Comprendre cette écriture » lit chaque ligne en langage courant. L\'enregistrement n\'est possible que si l\'écriture est équilibrée.</p><p><b>Journal</b> : AC achats, VE ventes, BQ banque, CA caisse, PA paie, OD opérations diverses, AN à-nouveaux. <b>Pièce</b> : numéro de la facture, du relevé ou du bulletin qui justifie l\'écriture.</p>',
jrn:'<p>Le <b>journal</b> liste toutes les écritures dans l\'ordre des dates. Filtrez par journal ou cherchez un mot, un compte, un numéro de pièce. « Modifier » rouvre l\'écriture dans l\'écran de saisie. Les exports servent aux contrôles et à l\'archivage.</p>',
gl:'<p>Le <b>grand livre</b> regroupe les mouvements compte par compte et calcule le solde progressif. C\'est l\'outil de contrôle : pour vérifier ce que doit un client, ce qui reste à payer à un fournisseur, ou comprendre un solde surprenant.</p>',
bal:'<p>La <b>balance</b> résume chaque compte : mouvements débit et crédit, puis solde. Total des soldes débiteurs et total des soldes créditeurs doivent être égaux. Lecture rapide : les comptes 4 (tiers) montrent qui doit quoi ; les comptes 5, l\'argent disponible ; les comptes 6 et 7, la formation du résultat.</p>',
plan:'<p>Le <b>plan comptable</b> est la liste des comptes autorisés. Le numéro dit la nature : classe 1 financement, 2 biens durables, 3 stocks, 4 tiers, 5 trésorerie, 6 charges, 7 produits. Vous pouvez ajouter des sous-comptes (par exemple 4111001 pour chaque client) : l\'outil les range sous leur compte principal dans les états.</p>',
clot:'<p>La <b>clôture</b> transforme une année d\'écritures en états financiers fiables. Suivez les sections dans l\'ordre : contrôles, amortissements, impôt, affectation du résultat, puis clôture. Les écritures générées automatiquement sont remplaçables : régénérez-les si les chiffres changent. La clôture verrouille l\'exercice et reporte les soldes de bilan dans l\'exercice suivant (écriture d\'à-nouveaux).</p>',
ef:'<p>Les <b>états financiers</b> sont calculés à partir des écritures. Les trois bandeaux verts vérifient la cohérence : bilan équilibré, résultat cohérent, flux de trésorerie cohérents. Le <b>bilan</b> montre ce que l\'entreprise possède (actif) et d\'où viennent les moyens (passif). Le <b>compte de résultat</b> montre comment l\'activité a créé (ou perdu) de la richesse. Le <b>tableau des flux</b> explique la variation de l\'argent disponible. Le détail est dans le Mode d\'emploi.</p>',
rap:'<p>Choisissez un rapport ou un document dans la liste : il s\'affiche, puis exportez-le en Word, Excel ou PDF (Imprimer). Les champs jaunes dans les documents types sont à compléter avant remise au client.</p>',
param:'<p>Réglez ici le nom du cabinet, les taux de TVA et d\'impôt (valeurs à confirmer avec la loi fiscale nationale) et faites vos <b>sauvegardes</b> : les données sont stockées dans ce navigateur seulement.</p>'
};

GUIDE.base=function(){return '<h3>1. L\'idée de la partie double</h3><p>Chaque événement a toujours <b>deux faces</b> : ce que l\'entreprise reçoit et ce qui le finance. Exemple : un client paie 100 000 en banque. Face 1 : la banque augmente de 100 000. Face 2 : la créance sur le client diminue de 100 000. La comptabilité inscrit les deux faces : l\'une au <b>débit</b>, l\'autre au <b>crédit</b>, pour le même montant. Débit et crédit ne veulent pas dire « bien » ou « mal » : ce sont les deux colonnes d\'un compte.</p>'+
 '<h3>2. Dans quel sens ça bouge ?</h3>'+G_table(['Type de compte','Augmente au…','Diminue au…','Exemples'],[
 ['Ce que l\'entreprise possède (biens, stocks, argent, créances)','Débit','Crédit','Banque 521, caisse 571, clients 411, stocks 31, matériel 24x'],
 ['Ce que l\'entreprise doit (dettes) et ses capitaux propres','Crédit','Débit','Fournisseurs 401, emprunts 16x, TVA due 4441, capital 101, réserves 11x'],
 ['Les charges (ce que l\'entreprise consomme)','Débit','Crédit','Achats 60x, loyers 622, salaires 661, intérêts 671'],
 ['Les produits (ce que l\'entreprise gagne)','Crédit','Débit','Ventes 701, services 706']])+
 '<div class="al info"><b>Moyen mnémotechnique.</b> Au débit : ce qu\'on <i>reçoit</i> ou <i>consomme</i> (emplois). Au crédit : <i>d\'où ça vient</i> (ressources). Achat de marchandises à crédit : on reçoit des marchandises (débit 601) et on doit de l\'argent (crédit 401).</div>'+
 '<h3>3. Les classes de comptes SYSCOHADA</h3>'+G_table(['Classe','Contenu','Où elle apparaît'],[
 ['1','Capital, réserves, résultat, emprunts, provisions','Bilan (passif)'],['2','Immobilisations (biens durables) et amortissements','Bilan (actif)'],['3','Stocks','Bilan (actif)'],['4','Tiers : fournisseurs, clients, personnel, État, associés','Bilan (actif ou passif selon le solde)'],['5','Trésorerie : banque, caisse','Bilan (actif ou passif)'],['6','Charges des activités ordinaires','Compte de résultat'],['7','Produits des activités ordinaires','Compte de résultat'],['8','Opérations hors activités ordinaires (HAO), participation, impôt sur le résultat','Compte de résultat']])+
 '<h3>4. Les journaux</h3>'+G_table(['Code','Journal','On y inscrit'],[['AC','Achats','Factures fournisseurs'],['VE','Ventes','Factures clients'],['BQ','Banque','Mouvements du relevé bancaire'],['CA','Caisse','Entrées et sorties d\'espèces'],['PA','Paie','Salaires et cotisations'],['OD','Opérations diverses','Capital, amortissements, régularisations, impôt'],['AN','À-nouveaux','Soldes repris du début d\'exercice']])+
 '<h3>5. Le trajet d\'une opération</h3><p>Pièce justificative → écriture dans un journal → report automatique au grand livre (par compte) → balance → états financiers (bilan, compte de résultat, flux). Vous ne saisissez qu\'une fois : tout le reste est calculé.</p>'+
 '<h3>6. La TVA en une phrase</h3><p>Vous facturez de la TVA à vos clients (TVA collectée, que vous devez à l\'État) et vous payez de la TVA à vos fournisseurs (TVA récupérable, que l\'État vous rend). Chaque période, on compare : si la TVA collectée est plus grande, on paie la différence ; sinon, on a un crédit de TVA. La TVA n\'est ni une charge ni un produit.</p>'+
 '<h3>7. Brut, amortissement, net</h3><p>Un ordinateur acheté 1 200 000 et utilisé 3 ans perd chaque année une partie de sa valeur : c\'est l\'amortissement. Il est enregistré comme une <b>charge</b> (681) sans sortie d\'argent, et cumulé dans un compte 28x. Au bilan : brut 1 200 000, amortissement cumulé, net = valeur restante.</p>'};

GUIDE.etats=function(){return '<h3>Le bilan : une photo à la clôture</h3><p>L\'<b>actif</b> montre ce que l\'entreprise possède : immobilisations (biens durables), stocks, créances, argent. Le <b>passif</b> montre d\'où viennent ces moyens : capitaux propres (capital, réserves, résultat), dettes financières, dettes d\'exploitation. Actif = passif toujours. Les amortissements sont déduits des biens : colonne « Brut », « Amortissements », « Net ».</p>'+
 '<h3>Le compte de résultat : un film de l\'année</h3><p>Il enchaîne des soldes pour montrer comment le résultat se forme :</p>'+G_table(['Solde','Calcul','Ce qu\'il dit'],[['Marge commerciale','Ventes de marchandises – achats – variation de stock','Ce que rapporte le négoce lui-même'],['Chiffre d\'affaires','Ventes de marchandises + produits fabriqués + services + accessoires','Le volume d\'activité'],['Valeur ajoutée','CA et autres produits – achats, transports, services extérieurs, impôts, autres charges','La richesse créée par l\'entreprise'],['Excédent brut d\'exploitation (EBE)','Valeur ajoutée – charges de personnel','La performance avant amortissements, frais financiers et impôt'],['Résultat d\'exploitation','EBE + reprises – dotations aux amortissements et provisions','Le résultat du métier'],['Résultat financier','Revenus financiers – frais financiers','Le coût du financement'],['Résultat HAO','Cessions et événements exceptionnels','Les éléments hors activité courante'],['Résultat net','Résultat des activités ordinaires + HAO – participation – impôt','Ce qui reste aux associés']])+
 '<h3>Le tableau des flux : où est passé l\'argent ?</h3><p>Il part de la trésorerie d\'ouverture et explique la variation jusqu\'à la clôture : les flux de l\'activité (résultat et amortissements, moins l\'augmentation des stocks et créances), les flux d\'investissement (achats de biens durables), les flux de financement (capital, emprunts, comptes d\'associés). La version de l\'outil est simplifiée.</p>'+
 '<h3>Les ratios</h3>'+G_table(['Ratio','Sens'],[['Fonds de roulement','Ressources stables – actif immobilisé : financement durable disponible pour le cycle d\'exploitation'],['Besoin en fonds de roulement','Actif circulant – passif circulant : argent immobilisé dans les stocks et créances, net des dettes d\'exploitation'],['Trésorerie nette','Trésorerie actif – trésorerie passif. Toujours égale à fonds de roulement – besoin en fonds de roulement'],['Autonomie financière','Capitaux propres / total du bilan : indépendance vis-à-vis des créanciers'],['Liquidité générale','Capacité à payer les dettes à court terme avec l\'actif à court terme']])+
 '<h3>Les trois contrôles automatiques</h3><ul><li><b>Bilan équilibré</b> : actif = passif.</li><li><b>Résultat cohérent</b> : le résultat net du compte de résultat égale le solde des comptes 6, 7 et 8.</li><li><b>Flux cohérents</b> : la trésorerie reconstituée est égale à celle du bilan.</li></ul><p>Un bandeau rouge ou orange appelle une vérification des écritures.</p>'};
GUIDE.clot=function(){return '<p>La clôture suit un ordre logique. Chaque étape est une section de la page « Clôture ».</p><ol><li><b>Contrôles</b> : rapprochements bancaires, caisse, inventaire des stocks et immobilisations, revue des clients et fournisseurs. Cochez la liste.</li><li><b>Régularisations</b> (écran de saisie, opérations guidées) :<ul><li><b>Charges constatées d\'avance</b> : une assurance de 12 mois payée en novembre ne pèse que 2 mois sur l\'exercice. Débit 476, crédit du compte de charge pour les 10 mois suivants.</li><li><b>Factures non parvenues</b> : un service rendu non facturé reste une charge de l\'exercice. Débit de la charge, crédit 408.</li><li><b>Dépréciation de créance</b> : une créance douteuse est reclassée (416) puis dépréciée : débit 691, crédit 491.</li><li><b>Cession d\'un bien</b> : prix au produit exceptionnel (82), valeur nette comptable en charge (81).</li></ul></li><li><b>Amortissements</b> : renseignez le fichier des immobilisations puis générez l\'écriture. Dotation = valeur ÷ durée, au prorata des jours depuis la mise en service (base 360 jours).</li><li><b>Impôt sur le résultat</b> : l\'outil applique le taux paramétré au résultat comptable. Faites valider les retraitements fiscaux par le responsable.</li><li><b>États financiers</b> : vérifiez les trois bandeaux de contrôle, complétez les notes annexes.</li><li><b>Approbation par l\'assemblée</b> : dans les six mois de la clôture pour la SA (AUSCGIE art. 548). La réserve légale reçoit au moins un dixième du bénéfice, après déduction des pertes antérieures, jusqu\'à atteindre le cinquième du capital (AUSCGIE art. 346). Dépôt des états au RCCM dans le mois suivant l\'approbation.</li><li><b>Affectation du résultat</b> : à passer dans l\'exercice suivant, via l\'outil dédié (bénéfice vers réserve légale, autres réserves, dividendes, report à nouveau).</li><li><b>Clôturer</b> : l\'exercice est verrouillé et l\'exercice suivant s\'ouvre avec ses à-nouveaux : les soldes des comptes de bilan sont repris, le résultat de l\'exercice est repris dans le compte 13 en attente d\'affectation.</li></ol><div class="al warn">Après l\'approbation des comptes, l\'écriture d\'affectation doit être passée dans l\'exercice suivant avant d\'en clôturer la fin : sinon le résultat de l\'année précédente et celui de l\'année en cours se mêlent dans le compte 13.</div>'};

 ['Le bilan affiche un écart.','Les écritures étant équilibrées, un écart vient presque toujours d\'un compte de classe 9 ou d\'un numéro invalide. Regardez la balance et corrigez le numéro.'],

 ['L\'outil remplace-t-il un expert-comptable ?','Non. Il aide à tenir et contrôler les comptes. Les taux fiscaux, les retraitements fiscaux, les statuts et le tableau des flux officiel sont à valider par un professionnel.']];

/* ---------- Calculs ---------- */
function gsum(rows,f){return (rows||[]).reduce(function(a,r){return a+f(r)},0)}
function mpeLoan(c){var m=c.mpe,L=num(m.emp),r=num(m.tx)/1200,n=Math.round(num(m.dur)*12),d=Math.min(Math.round(num(m.diff)),Math.max(0,n-1)),rows=[],bal=L;
 if(L>0&&n>0){var np=n-d,pay=(m.mode==='cst')?0:(r>0?L*r/(1-Math.pow(1+r,-np)):L/np);
  for(var i=1;i<=n;i++){var it=bal*r,cap,me;if(i<=d){cap=0;me=it}else if(m.mode==='cst'){cap=L/np;me=cap+it}else{me=pay;cap=pay-it}if(i===n){cap=bal;me=cap+it}var fin=bal-cap;rows.push({n:i,deb:bal,mens:me,int:it,cap:cap,fin:fin});bal=fin}}
 var ny=Math.max(5,Math.ceil(n/12)),yr=[];for(var y=1;y<=ny;y++){var a=rows.slice((y-1)*12,y*12);yr.push({y:y,open:a.length?a[0].deb:0,am:gsum(a,function(x){return x.cap}),int:gsum(a,function(x){return x.int}),ann:gsum(a,function(x){return x.mens})})}
 return {rows:rows,yr:yr}}
function mpeYears(c,pf,qf,loan){var m=c.mpe,g=m.g;pf=pf||1;qf=qf||1;
 var ca1=gsum(g.recettes,function(r){return num(r[1])*num(r[2])}),ach1=gsum(g.matieres,function(r){return num(r[1])*num(r[2])}),fo1=gsum(g.fonct,function(r){return num(r[1])*num(r[2])}),pe1=gsum(g.perso,function(r){return num(r[1])*num(r[2])});
 var frais=gsum(g.frais,function(r){return num(r[2])}),dfe=Math.max(1,num(m.dfe)),out=[];
 for(var t=1;t<=5;t++){var gt=Math.pow(1+num(m.gr)/100,t-1),fi=Math.pow(1+num(m.infl)/100,t-1),y={t:t};
  y.ca=ca1*gt*pf*qf;y.ach=ach1*gt*qf;y.mb=y.ca-y.ach;y.fo=fo1*fi;y.va=y.mb-y.fo;y.pe=pe1*fi;y.ebe=y.va-y.pe;
  y.am=gsum(g.equip,function(r){var d=Math.max(1,num(r[4]));return t<=d?num(r[3])/d:0})+(t<=dfe?frais/dfe:0);
  y.re=y.ebe-y.am;y.fin=loan.yr[t-1]?loan.yr[t-1].int:0;y.rai=y.re-y.fin;y.is=Math.max(0,y.rai)*num(m.tax)/100;y.rn=y.rai-y.is;y.cf=y.rn+y.am;
  y.am_p=loan.yr[t-1]?loan.yr[t-1].am:0;y.ann=loan.yr[t-1]?loan.yr[t-1].ann:0;y.capa=y.rn+y.am-y.ann;out.push(y)}
 return out}
function mpeCalc(c){var m=mpeInit(c),g=m.g,K={};
 K.frais=gsum(g.frais,function(r){return num(r[2])});K.equip=gsum(g.equip,function(r){return num(r[3])});K.bfr=gsum(g.bfr,function(r){return num(r[1])*num(r[2])});
 K.besoins=K.frais+K.equip+K.bfr;K.inv=K.frais+K.equip;
 K.res=num(m.apport)+num(m.famille)+num(m.nature)+num(m.subv)+num(m.emp);K.ecartFin=K.res-K.besoins;
 K.ca1=gsum(g.recettes,function(r){return num(r[1])*num(r[2])});K.ach1=gsum(g.matieres,function(r){return num(r[1])*num(r[2])});K.fo1=gsum(g.fonct,function(r){return num(r[1])*num(r[2])});K.pe1=gsum(g.perso,function(r){return num(r[1])*num(r[2])});
 K.prod=num(m.cycles)*num(m.qcycle);
 K.loan=mpeLoan(c);K.Y=mpeYears(c,1,1,K.loan);var Y=K.Y;
 /* trésorerie annuelle */
 var cum=0;K.T=[];for(var t=0;t<=5;t++){var o={t:t};o.cf=t?Y[t-1].cf:0;o.emp=t===0?num(m.emp):0;o.ap=t===0?num(m.apport)+num(m.famille)+num(m.nature)+num(m.subv):0;o.enc=o.cf+o.emp+o.ap;o.inv=t===0?K.inv:0;o.bfr=t===0?K.bfr:0;o.rem=t?K.loan.yr[t-1].am:0;o.dec=o.inv+o.bfr+o.rem;o.solde=o.enc-o.dec;cum+=o.solde;o.cum=cum;K.T.push(o)}
 /* VAN, TRI, DRCI */
 var r=num(m.act)/100,cost=K.besoins;K.van=-cost;K.disc=[];var cd=0;K.drci=null;
 for(var t=1;t<=5;t++){var co=1/Math.pow(1+r,t),a=Y[t-1].cf*co,prev=cd;cd+=a;K.van+=a;K.disc.push({t:t,co:co,a:a,cum:cd});if(K.drci===null&&cost>0&&cd>=cost){K.drci=(t-1)+(a?(cost-prev)/a:0)}}
 K.ip=cost>0?(K.van+cost)/cost:0;
 var f=function(x){var v=-cost;for(var t=1;t<=5;t++)v+=Y[t-1].cf/Math.pow(1+x,t);return v};K.tri=null;
 if(cost>0){var lo=-0.95,hi=10;if(f(lo)*f(hi)<0){for(var i=0;i<100;i++){var mid=(lo+hi)/2;if(f(lo)*f(mid)<=0)hi=mid;else lo=mid}K.tri=(lo+hi)/2}}
 /* seuil de rentabilité année 1 */
 var y1=Y[0];K.cfix=y1.fo+y1.pe+y1.am+y1.fin;K.cvar=y1.ach;K.mcv=y1.ca-y1.ach;K.tmcv=y1.ca?K.mcv/y1.ca:0;K.sr=K.tmcv>0?K.cfix/K.tmcv:0;
 /* hypothèses CA */

function b64blob(b,type){var bin=atob(b),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type})}
function mpeConcl(c,K){var m=c.mpe,Y=K.Y,rn=Y.reduce(function(a,y){return a+y.rn},0)/5,prom=m.promoteur||c.dirigeant||c.nom;

DOCT.manuel={n:'Manuel de procédures et d\'organisation comptables',f:function(c,e){var ff=FORMES[c.forme]||{};
 var sec=[['1. Objet et cadre juridique','Le présent manuel décrit les procédures et l\'organisation comptables de '+esc(c.nom)+', afin d\'assurer la continuité dans le temps de l\'accès à l\'information (AUDCIF art. 16). Il s\'applique conjointement à l\'Acte uniforme relatif au droit comptable et à l\'information financière et au Système comptable OHADA. Régime : '+(c.regime==='smt'?'Système minimal de trésorerie':'Système normal')+'.'],
 ['2. Organisation de la fonction comptable','Responsable de la comptabilité : '+L('')+'. Cabinet ou prestataire chargé de la tenue : '+esc(S.cfg.gsc)+'. Dirigeant : '+L(c.dirigeant)+'. Séparation des tâches : la personne qui engage la dépense ne règle pas le fournisseur seule ; les rapprochements bancaires sont effectués par une personne distincte du caissier lorsque l\'effectif le permet.'],
 ['3. Langue, unité monétaire et plan de comptes','Comptabilité tenue en langue française et en franc CFA (art. 17, 1°). Le plan de comptes est celui du Système comptable OHADA, détaillé en sous-comptes selon les besoins de l\'entité (liste jointe : Rapports → Plan comptable utilisé).'],
 ['4. Journaux et livres tenus','Journaux : achats (AC), ventes (VT), banque (BQ), caisse (CA), opérations diverses (OD), à-nouveaux (AN). Livres obligatoires : livre-journal, grand-livre, balance générale, livre d\'inventaire (art. 19). Les livres sont tenus sans blanc ni altération (art. 20).'],
 ['5. Pièces justificatives','Toute écriture est appuyée par une pièce datée (facture, relevé, quittance, bulletin de paie, acte). Classement : par journal, par mois, puis par numéro d\'ordre ; la référence de la pièce figure dans l\'écriture (art. 17, 3° et 5°). Les pièces sont conservées dix ans (art. 24). Ordre de classement retenu : '+L('')+'.'],
 ['6. Enregistrement, validation et clôture','Les opérations sont enregistrées chronologiquement. L\'entité valide ses écritures au plus tard à la fin de chaque mois ; une fois validées, elles reçoivent un numéro d\'ordre et ne peuvent plus être modifiées : toute erreur est corrigée par une écriture d\'annulation (art. 22). Une clôture informatique est effectuée au moins chaque trimestre, au plus tard à la fin du trimestre suivant. Une opération relative à une période déjà clôturée est enregistrée le premier jour de la période ouverte avec mention de sa date de valeur (art. 22, 4°).'],

 ['8. Arrêté des comptes','Les états financiers annuels (bilan, compte de résultat, tableau des flux de trésorerie, notes annexes) sont arrêtés au plus tard quatre mois après la clôture (art. 23) et approuvés par l\'organe compétent dans les délais légaux.'],
 ['9. Sécurité du traitement informatisé','Sauvegarde exportée après chaque séance de travail et conservée sur un support distinct ; accès limité aux personnes habilitées ; piste d\'audit des créations, modifications et suppressions ; restitution des données sur papier ou sous forme intelligible (art. 22, 1° et 5°).'],

function vAide(){ $('#main').innerHTML='<h2>Cadre juridique et limites</h2><div class="box"><h3>Textes pris en compte</h3><ul><li><b>AUDCIF 2017</b> (droit comptable et information financière) : états financiers, système normal et système minimal de trésorerie, conservation des documents.</li><li><b>SYSCOHADA révisé</b> et son Guide d\'application : plan de comptes, bilan, compte de résultat, tableau des flux.</li><li><b>AUSCGIE 2014</b> (sociétés commerciales et GIE) : capital minimum, libération, réserve légale, assemblée annuelle, commissaires aux comptes.</li><li><b>AUDCG 2010</b> (droit commercial général) : RCCM, entreprenant.</li><li><b>SYCEBNL 2022</b> (entités à but non lucratif), <b>AUSCOOP</b>, <b>AUS</b>, <b>AUPCAP</b> : consultés pour les spécificités de chaque forme.</li></ul></div><div class="box"><h3>Ce que l\'outil fait</h3><ul><li>Guide chaque dossier, de la création à la production des états financiers, avec la base légale de chaque étape.</li><li>Tient la comptabilité en partie double, contrôle l\'équilibre des écritures et produit balance, grand livre, bilan, compte de résultat et tableau des flux.</li><li>Calcule un projet économique sur cinq ans et assemble le dossier de projet.</li><li>Fige les écritures par validation numérotée, corrige par annulation, garde une piste d\'audit, assiste l\'inventaire des stocks, le rapprochement bancaire et la balance âgée, et contrôle la conformité à l\'AUDCIF.</li><li>Génère des écritures de clôture (amortissements, impôt, affectation, à-nouveaux) et des documents-types.</li></ul></div><div class="box"><h3>Limites à connaître</h3><ul><li><b>Droit national</b> : TVA, impôt sur le résultat, formalités du guichet unique, enregistrement, organismes sociaux relèvent du droit national et ne figurent pas dans les Actes uniformes. Les étapes concernées sont marquées « Pratique nationale ».</li><li><b>Tableau des flux</b> : établi selon la méthode du Guide d\'application (capacité d\'autofinancement globale, variations du bilan, flux d\'investissement et de financement) ; une ligne d\'écart apparaît si des opérations sans trésorerie (apport en nature, par exemple) ne sont pas identifiables.</li><li><b>Affectation des comptes aux postes</b> : se fait selon le sens du solde de chaque compte ; les tableaux de correspondance du Guide (Titre IX) ne figurent pas dans les documents fournis, vérifiez les cas particuliers.</li><li><b>Système minimal de trésorerie</b> : les états officiels et les seuils de chiffre d\'affaires sont fixés par chaque État partie ; ils ne figurent pas dans l\'AUDCIF.</li><li><b>Écritures validées</b> : l\'intangibilité est assurée dans l\'outil, mais l\'outil reste enregistré dans un navigateur ; l\'archivage de sauvegardes sur dix ans (art. 24) relève de vous.</li><li><b>Certification</b> : le contrôle de conformité ne remplace pas le commissaire aux comptes lorsque la loi l\'impose.</li><li><b>SYCEBNL</b> : l\'outil applique le plan SYSCOHADA ; complétez les comptes propres aux entités à but non lucratif.</li><li><b>Impôt</b> : calcul indicatif sur le résultat comptable, sans retraitements fiscaux.</li><li><b>Statuts, actes juridiques et déclarations</b> : l\'outil donne des trames ; leur rédaction définitive relève des professionnels compétents (notaire, juriste, expert-comptable).</li><li>Les données sont locales au navigateur : sauvegardez-les régulièrement.</li></ul></div>'}

GUIDE.conf=function(){return '<h3>Pourquoi des écritures « validées » ?</h3><p>L\'AUDCIF (art. 22) exige qu\'une comptabilité informatisée rende les enregistrements <b>irréversibles</b> : une écriture saisie doit être validée au plus tard à la fin de chaque période (un mois au plus), puis ne plus pouvoir être supprimée ni modifiée. Dans <b>Journaux</b>, utilisez « Valider les écritures jusqu\'à cette date ». L\'écriture reçoit un numéro d\'ordre définitif.</p><h3>Corriger une erreur</h3><p>Sur une écriture validée, le bouton « Corriger » passe l\'écriture inverse (annulation) ; vous saisissez ensuite la bonne écriture. Si l\'erreur vient d\'un exercice clos, elle se corrige dans l\'exercice en cours, en report à nouveau, et se signale dans la note 2.</p><h3>Date de valeur</h3><p>Une opération datée dans une période déjà validée est enregistrée le premier jour de la période ouverte ; sa date réelle reste visible (art. 22, 4°).</p><h3>Clôture informatique trimestrielle</h3><p>Elle fige la chronologie. Le bouton figure dans Journaux. Elle doit être faite au plus tard à la fin du trimestre qui suit chaque trimestre écoulé.</p><h3>Inventaire</h3><p><b>Inventaire et justification</b> : saisissez les stocks comptés, générez l\'écriture de variation ; rapprochez la banque ; examinez la balance âgée. Le <b>livre d\'inventaire</b> et le <b>manuel de procédures</b> se téléchargent dans Rapports et documents.</p><h3>Tableau de conformité</h3><p>L\'écran <b>Conformité SYSCOHADA</b> liste les contrôles possibles et l\'article de l\'AUDCIF correspondant : ✔ conforme, ⚠ à surveiller, ✖ non conforme, ℹ information.</p>'};
